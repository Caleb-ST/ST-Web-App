<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sydney Tools — Rep Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
document.documentElement.style.visibility="hidden";
(async()=>{
  const _sb=supabase.createClient(
    "https://lwdosqlldficpbdwiuvt.supabase.co",
    "sb_publishable_f4o3UzA5FKX6tvCPpE0EyQ_aCe7B3kN"
  );
  const {data:{session}}=await _sb.auth.getSession();
  if(!session||!session.user.email.endsWith("@sydneytools.com.au")){
    window.location.href="index.html";
    return;
  }
  document.documentElement.style.visibility="";
})();
</script>

<style>
:root{
  --void:#0a0a0d;--graphite:#15151b;--graphite2:#1b1b22;--panel:#111117;
  --steel:#8a8e99;--paper:#f5f3ef;--signal:#ff2230;--signal-dim:rgba(255,34,48,.14);
  --spark:#ffb020;--line:rgba(245,243,239,.10);--line-strong:rgba(245,243,239,.18);
  --display:'Barlow Condensed',sans-serif;--body:'Work Sans',sans-serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh}
body{background:var(--void);color:var(--paper);font-family:var(--body)}
a{color:inherit}
button,input{font:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:24px 18px 56px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.title-block{min-width:240px}
.eyebrow{font:11px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--spark)}
h1{margin:4px 0 2px;font:700 clamp(34px,5vw,48px)/1 var(--display);text-transform:uppercase}
.subtitle{margin:0;color:var(--steel);font-size:13px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.top-link{display:inline-flex;align-items:center;min-height:38px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;text-decoration:none;color:var(--steel);font:11px var(--mono);letter-spacing:.03em}
.top-link:hover{color:var(--paper);border-color:rgba(255,34,48,.4)}

.controls{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px;background:rgba(10,10,13,.95);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.22)}
.search-wrap{flex:1;min-width:260px;position:relative}
.search{width:100%;min-height:44px;padding:11px 42px 11px 14px;background:linear-gradient(180deg,#191920,#111117);border:1px solid var(--line-strong);border-radius:8px;color:var(--paper);outline:none}
.search::placeholder{color:#747884}
.search:focus{border-color:var(--spark);box-shadow:0 0 0 3px rgba(255,176,32,.10)}
.clear-search{position:absolute;right:8px;top:7px;width:30px;height:30px;border:0;background:transparent;color:var(--steel);cursor:pointer;border-radius:6px}
.clear-search:hover{background:rgba(255,255,255,.05);color:var(--paper)}
.filter-toggle{display:flex;align-items:center;gap:8px;min-height:40px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--graphite);color:var(--steel);cursor:pointer;font:11px var(--mono);user-select:none}
.filter-toggle:hover{color:#fff;border-color:rgba(255,34,48,.4)}
.filter-toggle:has(input:checked){color:#fff;border-color:var(--signal);background:var(--signal-dim)}
.filter-toggle input{accent-color:var(--signal);margin:0}

.stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.stat{padding:7px 10px;background:var(--graphite);border:1px solid var(--line);border-radius:7px;color:var(--steel);font:11px var(--mono)}
.stat strong{color:var(--paper)}
.stat.warn{color:var(--spark);border-color:rgba(255,176,32,.24)}

.layout{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:14px;align-items:start}
.directory{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:calc(100vh - 190px);display:flex;flex-direction:column;position:sticky;top:82px}
.directory-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.directory-head strong{font:600 14px var(--body)}
.directory-head span{font:10px var(--mono);color:var(--steel)}
.company-list{overflow:auto;padding:6px}
.company-list::-webkit-scrollbar,.detail::-webkit-scrollbar{width:7px}
.company-list::-webkit-scrollbar-thumb,.detail::-webkit-scrollbar-thumb{background:#34343e;border-radius:10px}
.company-btn{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--paper);padding:11px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px}
.company-btn:hover{background:var(--graphite);border-color:var(--line)}
.company-btn.active{background:var(--signal-dim);border-color:rgba(255,34,48,.4)}
.company-name{font-weight:600;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.company-meta{display:flex;gap:5px;align-items:center;flex-shrink:0}
.badge{font:9.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--steel)}
.badge.warn{color:var(--spark);border-color:rgba(255,176,32,.28)}
.empty{padding:24px;color:var(--steel);font-size:13px}

.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:460px;overflow:hidden}
.detail-placeholder{padding:42px 28px;color:var(--steel);text-align:center}
.detail-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#18181f,#121217)}
.detail-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.detail h2{margin:0;font:700 30px/1 var(--display);text-transform:uppercase}
.detail-sub{margin-top:6px;color:var(--steel);font-size:12px}
.detail-body{padding:20px 22px 24px}

.rep-card{background:#0d0d12;border:1px solid var(--line);border-radius:8px;padding:16px 17px;margin-bottom:12px}
.rep-card:last-child{margin-bottom:0}
.rep-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:4px}
.rep-name{font:600 18px var(--display);text-transform:uppercase}
.rep-role{margin-top:3px;color:var(--steel);font-size:12px}
.rep-row{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rep-key{font:10.5px var(--mono);color:var(--steel);text-transform:uppercase;letter-spacing:.05em}
.rep-val{font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.rep-val a{color:inherit;text-decoration:none;font:inherit}
.rep-val a:hover,.rep-val a:focus-visible{color:inherit;text-decoration:none;opacity:.82}
.copy-btn{background:#18181f;border:1px solid var(--line);color:var(--steel);font:10.5px var(--mono);padding:6px 9px;border-radius:6px;cursor:pointer}
.copy-btn:hover{border-color:rgba(255,34,48,.4);color:var(--paper)}
.muted-value{color:var(--steel)}

.toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;border-radius:7px;background:var(--graphite);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;max-width:380px;z-index:100}
.toast .t{font-weight:700;font-size:13px;margin-bottom:2px}
.toast .m{color:var(--steel);font-size:12px;white-space:pre-wrap}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .directory{position:static;max-height:320px}
  .controls{top:0}
}
@media(max-width:560px){
  .wrap{padding:16px 12px 40px}
  .topbar{align-items:flex-start}
  .top-actions{width:100%}
  .top-link{flex:1;justify-content:center}
  .controls{padding:9px}
  .search-wrap{min-width:100%}
  .filter-toggle{flex:1;justify-content:center}
  .detail-head,.detail-body{padding-left:16px;padding-right:16px}
  .rep-row{grid-template-columns:64px minmax(0,1fr) auto}
}
</style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <div class="title-block">
      <div class="eyebrow">01 — Contacts</div>
      <h1>Rep Directory</h1>
      <p class="subtitle">Find a supplier, then view the current rep contact details.</p>
    </div>
    <div class="top-actions">
      <a class="top-link" href="index.html">← Index</a>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <input class="search" id="searchInput" type="search" placeholder="Search company, rep, role, phone or email…" autocomplete="off">
      <button class="clear-search" id="clearSearch" type="button" title="Clear search">✕</button>
    </div>
    <label class="filter-toggle">
      <input type="checkbox" id="hideDupes">
      Hide duplicate names
    </label>
  </div>

  <div class="stats">
    <div class="stat" id="companyCount"><strong>—</strong> companies</div>
    <div class="stat" id="repCount"><strong>—</strong> reps</div>
    <div class="stat warn" id="dupCount"><strong>—</strong> duplicate entries</div>
  </div>

  <div class="layout">
    <section class="directory" aria-label="Rep company directory">
      <div class="directory-head">
        <strong>Companies</strong>
        <span id="visibleCount">0 shown</span>
      </div>
      <div class="company-list" id="companyList">
        <div class="empty">Loading rep directory…</div>
      </div>
    </section>

    <section class="detail" id="detailPane">
      <div class="detail-placeholder">Select a company from the list to view its reps.</div>
    </section>
  </div>
</div>

<div class="toast" id="toast">
  <div class="t" id="toastTitle">Notice</div>
  <div class="m" id="toastMsg"></div>
</div>

<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/15kykL5WcaZ4KrFmDI853rQjOwvt-YFEI5tu5U1V2LQ0/export?format=csv";

let allReps=[];
let companies=[];
let selectedCompany="";

const el=id=>document.getElementById(id);

function showToast(title,msg){
  el("toastTitle").textContent=title;
  el("toastMsg").textContent=msg;
  el("toast").style.display="block";
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>el("toast").style.display="none",3200);
}

function escapeHtml(str){
  return String(str??"")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function copyText(text){
  const t=String(text||"");
  if(!t)return;
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(t).then(()=>showToast("Copied",t),()=>fallbackCopy(t));
    return;
  }
  fallbackCopy(t);

  function fallbackCopy(value){
    try{
      const ta=document.createElement("textarea");
      ta.value=value;
      ta.setAttribute("readonly","");
      ta.style.position="fixed";
      ta.style.top="-1000px";
      ta.style.left="-1000px";
      ta.style.opacity="0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0,ta.value.length);
      const ok=document.execCommand("copy");
      document.body.removeChild(ta);
      if(ok)showToast("Copied",value);
      else showToast("Copy blocked","Browser blocked copy.");
    }catch(e){
      showToast("Copy blocked","Browser blocked copy.");
    }
  }
}

function parseCSV(csv){
  const rows=[];
  let row=[],cell="",inQuotes=false;
  for(let i=0;i<csv.length;i++){
    const ch=csv[i],next=csv[i+1];
    if(ch==='"'&&inQuotes&&next==='"'){cell+='"';i++;}
    else if(ch==='"'){inQuotes=!inQuotes;}
    else if(ch===","&&!inQuotes){row.push(cell);cell="";}
    else if((ch==="\n"||ch==="\r")&&!inQuotes){
      if(cell.length||row.length){row.push(cell);rows.push(row);row=[];cell="";}
      if(ch==="\r"&&next==="\n")i++;
    }else cell+=ch;
  }
  if(cell.length||row.length){row.push(cell);rows.push(row);}
  const headers=(rows.shift()||[]).map(h=>(h??"").trim());
  const data=rows.filter(r=>r.some(v=>(v??"").trim()!=="")).map(r=>{
    const obj={};
    headers.forEach((h,idx)=>obj[h]=(r[idx]??"").trim());
    return obj;
  });
  return{headers,data};
}

function normHeader(h){return(h||"").trim().toLowerCase().replace(/\s+/g," ")}
function findHeader(headers,tests){
  for(const test of tests){
    const found=headers.find(h=>test(normHeader(h)));
    if(found)return found;
  }
  return null;
}

function detectMapping(headers){
  const companyKey=findHeader(headers,[
    h=>h==="company",h=>h.includes("company"),h=>h.includes("supplier"),
    h=>h.includes("brand")&&!h.includes("rep")
  ]);
  const roleKey=findHeader(headers,[
    h=>h==="role",h=>h.includes("role"),h=>h.includes("position"),h=>h.includes("title")
  ]);
  const nameKey=findHeader(headers,[
    h=>h==="name",h=>h.includes("rep name"),h=>h.includes("contact name"),
    h=>h.includes("name"),h=>h.includes("rep")&&h.includes("contact")
  ]);
  const phoneKey=findHeader(headers,[
    h=>h==="phone",h=>h.includes("phone"),h=>h.includes("mobile"),
    h=>h.includes("contact number"),h=>h.includes("tel")
  ]);
  const emailKey=findHeader(headers,[
    h=>h==="email",h=>h.includes("email"),h=>h.includes("e-mail")
  ]);
  return{companyKey,roleKey,nameKey,phoneKey,emailKey};
}

function normalizeName(name){return(name||"").trim().toLowerCase().replace(/\s+/g," ")}
function normalizeCompany(c){return(c||"").trim().replace(/\s+/g," ")}

function withDuplicateFlags(reps){
  const counts={};
  reps.forEach(r=>{
    const key=normalizeName(r.name);
    if(!key)return;
    counts[key]=(counts[key]||0)+1;
  });
  return reps.map(r=>({...r,isDuplicate:counts[normalizeName(r.name)]>1}));
}

function buildRepObjects(parsed,mapping){
  const{companyKey,roleKey,nameKey,phoneKey,emailKey}=mapping;
  if(!nameKey){
    showToast("Column mapping issue","Could not find a Name column in the sheet.");
  }
  return parsed.map(row=>{
    const company=companyKey?(row[companyKey]||"").trim():"";
    const role=roleKey?(row[roleKey]||"").trim():"";
    const name=nameKey?(row[nameKey]||"").trim():"";
    const phone=phoneKey?(row[phoneKey]||"").trim():"";
    const email=emailKey?(row[emailKey]||"").trim():"";
    return{company,role,name,phone,email};
  }).filter(r=>r.name||r.company||r.role||r.phone||r.email);
}

function groupByCompany(reps){
  const map=new Map();
  reps.forEach(r=>{
    const c=normalizeCompany(r.company)||"Unknown";
    if(!map.has(c))map.set(c,[]);
    map.get(c).push(r);
  });
  return Array.from(map.entries()).map(([name,reps])=>({
    name,
    reps:reps.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")),
    count:reps.length,
    dupCount:reps.filter(x=>x.isDuplicate).length
  })).sort((a,b)=>a.name.localeCompare(b.name));
}

function getFilteredCompanies(){
  const q=el("searchInput").value.trim().toLowerCase();
  const hideDupes=el("hideDupes").checked;

  return companies.map(c=>{
    const reps=hideDupes?c.reps.filter(r=>!r.isDuplicate):c.reps.slice();
    return{...c,reps,count:reps.length,dupCount:reps.filter(r=>r.isDuplicate).length};
  }).filter(c=>{
    if(!c.reps.length)return false;
    if(!q)return true;
    if(c.name.toLowerCase().includes(q))return true;
    return c.reps.some(r=>[r.name,r.role,r.phone,r.email].join(" ").toLowerCase().includes(q));
  });
}

function renderStats(filtered){
  const visibleReps=filtered.reduce((sum,c)=>sum+c.count,0);
  const duplicateEntries=allReps.filter(r=>r.isDuplicate).length;
  el("companyCount").innerHTML="<strong>"+filtered.length+"</strong> companies";
  el("repCount").innerHTML="<strong>"+visibleReps+"</strong> reps";
  el("dupCount").innerHTML="<strong>"+duplicateEntries+"</strong> duplicate entries";
  el("dupCount").style.display=duplicateEntries?"block":"none";
}

function renderDirectory(filtered){
  const list=el("companyList");
  el("visibleCount").textContent=filtered.length+" shown";

  if(!filtered.length){
    list.innerHTML='<div class="empty">No companies match this search.</div>';
    return;
  }

  list.innerHTML=filtered.map(c=>
    '<button class="company-btn '+(selectedCompany===c.name?"active":"")+'" data-company="'+escapeHtml(c.name)+'">'+
      '<span class="company-name">'+escapeHtml(c.name)+'</span>'+
      '<span class="company-meta">'+
        '<span class="badge">'+c.count+' rep'+(c.count===1?"":"s")+'</span>'+
        (c.dupCount?'<span class="badge warn">'+c.dupCount+' dup</span>':"")+
      '</span>'+
    '</button>'
  ).join("");
}

function contactRow(key,val,type){
  let display='<span class="muted-value">—</span>';
  if(val){
    const safe=escapeHtml(val);
    if(type==="email"){
      display='<a href="mailto:'+safe+'">'+safe+'</a>';
    }else if(type==="phone"){
      const tel=escapeHtml(val.replace(/\s+/g,""));
      display='<a href="tel:'+tel+'">'+safe+'</a>';
    }else{
      display=safe;
    }
  }

  return '<div class="rep-row">'+
    '<div class="rep-key">'+escapeHtml(key)+'</div>'+
    '<div class="rep-val">'+display+'</div>'+
    (val?'<button class="copy-btn" type="button" data-copy="'+escapeHtml(val)+'">Copy</button>':'<span></span>')+
  '</div>';
}

function renderDetail(filtered){
  const pane=el("detailPane");
  const company=filtered.find(c=>c.name===selectedCompany);

  if(!company){
    pane.innerHTML='<div class="detail-placeholder">Select a company from the list to view its reps.</div>';
    return;
  }

  pane.innerHTML=
    '<div class="detail-head">'+
      '<div class="detail-title-row">'+
        '<div><h2>'+escapeHtml(company.name)+'</h2><div class="detail-sub">'+company.count+' current rep'+(company.count===1?"":"s")+'</div></div>'+
        (company.dupCount?'<span class="badge warn">'+company.dupCount+' duplicate entr'+(company.dupCount===1?"y":"ies")+'</span>':'')+
      '</div>'+
    '</div>'+
    '<div class="detail-body">'+
      company.reps.map(r=>
        '<div class="rep-card">'+
          '<div class="rep-card-head">'+
            '<div><div class="rep-name">'+escapeHtml(r.name||"Unnamed Rep")+'</div>'+
            (r.role?'<div class="rep-role">'+escapeHtml(r.role)+'</div>':'')+'</div>'+
            (r.isDuplicate?'<span class="badge warn">Duplicate</span>':'')+
          '</div>'+
          contactRow("Phone",r.phone,"phone")+
          contactRow("Email",r.email,"email")+
        '</div>'
      ).join("")+
    '</div>';

  pane.querySelectorAll("[data-copy]").forEach(btn=>{
    btn.addEventListener("click",()=>copyText(btn.getAttribute("data-copy")));
  });
}

function refresh(){
  const filtered=getFilteredCompanies();

  if(selectedCompany&&!filtered.some(c=>c.name===selectedCompany)){
    selectedCompany=filtered[0]?.name||"";
  }
  if(!selectedCompany&&filtered.length){
    selectedCompany=filtered[0].name;
  }

  renderStats(filtered);
  renderDirectory(filtered);
  renderDetail(filtered);
}

fetch(SHEET_URL)
  .then(res=>{
    if(!res.ok)throw new Error("Could not load rep sheet");
    return res.text();
  })
  .then(csv=>{
    const parsed=parseCSV(csv);
    const mapping=detectMapping(parsed.headers);
    if(!mapping.nameKey){
      showToast("Headers found","Your sheet headers are:\n"+parsed.headers.join(", "));
    }
    allReps=withDuplicateFlags(buildRepObjects(parsed.data,mapping));
    companies=groupByCompany(allReps);
    refresh();
  })
  .catch(err=>{
    console.error(err);
    el("companyList").innerHTML='<div class="empty">Error loading reps: '+escapeHtml(err.message||err)+'</div>';
    el("detailPane").innerHTML='<div class="detail-placeholder">Rep data could not be loaded.</div>';
  });

el("searchInput").addEventListener("input",refresh);
el("hideDupes").addEventListener("change",refresh);
el("clearSearch").addEventListener("click",()=>{
  el("searchInput").value="";
  refresh();
  el("searchInput").focus();
});

el("companyList").addEventListener("click",e=>{
  const btn=e.target.closest("[data-company]");
  if(!btn)return;
  selectedCompany=btn.dataset.company;
  const filtered=getFilteredCompanies();
  renderDirectory(filtered);
  renderDetail(filtered);
  if(window.innerWidth<861){
    el("detailPane").scrollIntoView({behavior:"smooth",block:"start"});
  }
});
</script>
</body>
</html>
